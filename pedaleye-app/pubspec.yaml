name: pedaleye_app
description: "페달아이 운전자 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  connectivity_plus: ^7.3.0
  crypto: ^3.0.6
  cryptography: ^2.9.0
  device_info_plus: ^13.3.0
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.34.5
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  http: ^1.6.0
  material_ui: ^1.11.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
